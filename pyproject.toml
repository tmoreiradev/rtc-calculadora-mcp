[project]
name = "rtc-calculadora-mcp"
version = "0.1.0"
description = "MCP server exposing the Receita Federal's official tax-reform (CBS/IBS/IS) calculator as tools for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.scripts]
rtc-calculadora-mcp = "rtc_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["contract: needs a running official calculator (RTC_URL)"]
addopts = "-m 'not contract'"
