services:
  calculadora:
    build: ./calculadora
    image: rtc-calculadora:1.6.1
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/calculadora/dados-abertos/versao HTTP/1.0\r\n\r\n\" >&3 && grep -q versaoApp <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
